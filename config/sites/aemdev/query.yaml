        select: head > meta[name="event-date"]
        value: |
          attribute(el, "content")
      recapVideo:
        select: head > meta[name="recap-video"]
        value: |
          attribute(el, "content")
      speakers:
        select: head > meta[name="speakers"]
        value: |
          attribute(el, "content")
      location:
        select: head > meta[name="location"]
        value: |
          attribute(el, "content")

  #aemdev BIOS# — speaker and author bios written by tools/bio-manager.
  # /en/fragments/** is excluded from aemdev-en above, so these are indexed
  # here and nowhere else. Consumers: the Bio Manager roster (cross-checks the
  # DA sheet against what is actually published) and any listing block that
  # needs speaker names without fetching one document per speaker.
  # blocks/speakers does NOT read this — it resolves slugs to documents
  # directly, so a bio renders the moment it is previewed.
  aemdev-bios:
    include:
      - /en/fragments/bios/**
    target: /en/fragments/bios/query-index.json
    properties:
      name:
        select: head > meta[name="bio-name"]
        value: |
          attribute(el, "content")
      jobTitle:
        select: head > meta[name="bio-title"]
        value: |
          attribute(el, "content")
      company:
        select: head > meta[name="bio-company"]
        value: |
          attribute(el, "content")
      linkedin:
        select: head > meta[name="bio-linkedin"]
        value: |
          attribute(el, "content")
      reviewStatus:
        select: head > meta[name="bio-status"]
        value: |
          attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: |
          match(attribute(el, "content"), "https:\/\/[^/]+(/.*)")
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, "content")
      lastModified:
        select: none
        value: |
          parseTimestamp(headers['last-modified'], 'ddd, DD MMM YYYY hh:mm:ss GMT')
