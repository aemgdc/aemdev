<!DOCTYPE html>
<html>
  <head>
    <title>AEM Bio Picker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="data:,">
    <!-- Import DA App SDK -->
    <script src="https://da.live/nx/utils/sdk.js" type="module"></script>
    <!-- Project App Logic -->
    <script src="/tools/bio-picker/bio-picker.js" type="module"></script>

    <link rel="stylesheet" type="text/css" href="/tools/bio-picker/bio-picker.css">
  </head>
  <body>
    <h2>Bio Picker</h2>

    <div id="search-container">
      <input id="bio-search" type="search" placeholder="Search by name, title, or company…"
        autocomplete="off" />
    </div>

    <div id="bios-container"></div>

    <div id="selected-container">
      <div id="selected-label">Selected Bios:</div>
      <ul id="selected-bios"></ul>
    </div>

    <div id="current-bio-container">
      <div id="current-label">Current Selection:</div>
      <div id="current-bio">(none)</div>
    </div>

    <div id="button-container" class="buttons">
      <button id="addBio" disabled>Add Bio</button>
      <button id="resetSelection">Reset</button>
      <button id="insertBios">Insert Speakers</button>
    </div>
  </body>
</html>
