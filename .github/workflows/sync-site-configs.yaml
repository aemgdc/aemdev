name: Sync site configs
on:
  workflow_dispatch:
    inputs:
      site:
        description: Site to sync
        required: true
        type: choice
        options:
          - aemdev
        default: aemdev
  schedule:
    # Daily snapshot so config drift in the AEM config service shows up as a commit,
    # the same way sync-fastly-config surfaces drift from the Fastly UI.
    - cron: '43 6 * * *'

permissions:
  contents: write

jobs:
  syncConfigs:
    environment:
      name: main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate selected site config directory
        run: |
          SITE="${{ inputs.site || 'aemdev' }}"
          CONFIG_DIR="config/sites/$SITE"
          echo "Preflight: Sync site configs | site=$SITE | configDir=$CONFIG_DIR"
          if [ ! -d "$CONFIG_DIR" ]; then
            echo "::error::Missing config directory for selected site: $CONFIG_DIR"
            exit 1
          fi
      - name: Run sync script
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          # inputs.site is empty on the scheduled run; default to aemdev.
          SITE_NAME: ${{ inputs.site || 'aemdev' }}
        run: node scripts/sync-site-configs.mjs
      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/sites
          if git diff --cached --quiet; then
            echo "No site config changes to commit"
            exit 0
          fi
          git commit -m "Sync site configs from config service"
          git push
