# ═══════════════════════════════════════════════════════════════════════════════
# ADDED BY THE TRACKER BRANCH — NOT YET DEPLOYED.
#
# Read docs/adaptto-2026/subproducts.md#s11 before pushing ANY of this. The repo
# copy of this file is a strict SUBSET of what is deployed: the live config emits
# eight properties defined nowhere here (bookAuthor, bookPublishDate,
# bookTypeTitle, displayLabel, eventDateTime, eventDisplayLabel, eventDisplayTime,
# offDateTime). Because `update-index-configuration` is a blind PUSH, deploying
# this file as it stands DELETES those eight and triggers a full reindex.
#
# The order is not optional:
#   1. run the `Sync site configs` workflow  — the diff it produces IS the drift report
#   2. decide, deliberately, to keep or drop those eight properties
#   3. only then run `Update Index Configuration File` with site: aemdev
#   4. re-preview the affected paths — pushing config does NOT backfill
#   5. run `Sync site configs` again to prove no drift remains
# ═══════════════════════════════════════════════════════════════════════════════

  #aemdev TRACKER# — the QA / translation tracker's own documents.
  # /tracker/** is outside aemdev-en's `include: /en/**`, so these are indexed here
  # and nowhere else, and they stay out of /en/sitemap.xml by construction.
  #
  # This index is the reason the review documents carry a metadata block at all: it
  # lets the Page Tracker and the boards read every page's stored verdict in ONE
  # fetch per group, instead of one document read per page.
  #
  # These pages are noindex four ways over (per-page metadata row, absence from
  # aemdev-en, an x-robots-tag on /tracker/* in headers.json, and a robots.txt
  # Disallow). `robots` is indexed so a feed block can prove that, not assume it.
  aemdev-tracker:
    include:
      - /tracker/qa/**
      - /tracker/tx/**
    target: /tracker/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, "content")
      robots:
        select: head > meta[name="robots"]
        value: |
          attribute(el, "content")
      pagePath:
        select: head > meta[name="page-path"]
        value: |
          attribute(el, "content")
      locale:
        select: head > meta[name="locale"]
        value: |
          attribute(el, "content")
      reviewStatus:
        select: head > meta[name="review-status"]
        value: |
          attribute(el, "content")
      reviewActor:
        select: head > meta[name="review-actor"]
        value: |
          attribute(el, "content")
      reviewUpdated:
        select: head > meta[name="review-updated"]
        value: |
          attribute(el, "content")
      translationStatus:
        select: head > meta[name="translation-status"]
        value: |
          attribute(el, "content")
      sentAt:
        select: head > meta[name="sent-at"]
        value: |
          attribute(el, "content")
      contentEscalation:
        select: head > meta[name="content-escalation"]
        value: |
          attribute(el, "content")
      lastModified:
        select: none
        value: |
          parseTimestamp(headers['last-modified'], 'ddd, DD MMM YYYY hh:mm:ss GMT')

